<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient (Deep dark cyber purple) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160b2e" />
      <stop offset="100%" stop-color="#090414" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.15" />
    </linearGradient>

    <!-- Ambient Top Glow -->
    <radialGradient id="topGlow" cx="50%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#160b2e" stop-opacity="0" />
    </radialGradient>

    <!-- Letter S Gradient (Vibrant White to Light Purple) -->
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f3e8ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Code Tag Brackets Gradient (Neon Violet to Indigo) -->
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Slash Gradient -->
    <linearGradient id="slashGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtle Drop Shadow / Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#a855f7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)" />
  <rect width="128" height="128" rx="30" fill="url(#topGlow)" />
  <rect x="2" y="2" width="124" height="124" rx="28" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Code Tag Elements < S / > with Neon Glow -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <polyline points="26,44 14,64 26,84" fill="none" stroke="url(#bracketGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Letter S -->
    <path d="M 64,48 C 62,43 56,41 50,41 C 42,41 37,45 37,51 C 37,58 43,60 52,63 C 63,66 67,70 67,77 C 67,84 61,87 52,87 C 44,87 38,85 36,80" fill="none" stroke="url(#sGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Slash / -->
    <line x1="77" y1="84" x2="87" y2="44" stroke="url(#slashGrad)" stroke-width="6.5" stroke-linecap="round" />

    <!-- Right Bracket > -->
    <polyline points="102,44 114,64 102,84" fill="none" stroke="url(#bracketGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
